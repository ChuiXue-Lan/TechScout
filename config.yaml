# LLM 配置
llm:
  provider: "minimax"  # claude / openai / ollama
  model: "MiniMax-M2.7"  # 3.7 Sonnet - 性能强，性价比好
  api_key: "${MINIMAX_API_KEY}"  # 从环境变量读取

  # OpenAI 配置（当 provider 为 openai 时使用）
  openai_api_key: "${OPENAI_API_KEY}"
  openai_model: "gpt-4o-mini"

  # 摘要 prompt (Smart Brevity 风格)
  summary_prompt: |
    你是一个文章摘要生成器。直接输出结果，禁止任何前言、解释或思考过程。

    [文章标题]：{title}
    [文章内容]：{content}

    【绝对禁止】：
    - 禁止输出”用户要求”、”按照格式”、”现在生成”等任何说明性文字
    - 禁止重复文章内容或标题之外的任何引导语

    【输出格式，严格照抄结构】：
    🏷️ [中文标题]
    📌 [一句话核心观点，不超过50字]
    💡 为什么值得关注: [1-2句话说明]
    🔬 技术方法: [用1-2句说明核心技术手段、模型或框架]
    📊 实验结果: [列出1-2个关键量化指标或对比结论]
    📋 关键要点:
    • [要点1]
    • [要点2]
    • [要点3]
    ⭐ 推荐: [值得精读 / 建议浏览 / 可跳过]

# 推送配置
notify:
  notify_mode: "digest"  # full: 每篇推完整摘要；digest: 写入表格后推一条汇总
  # 飞书机器人（Webhook 推送）
  feishu:
    enabled: true
    webhook_url: "${FEISHU_WEBHOOK}"

  # 飞书多维表格（Bitable 写入）
  feishu_bitable:
    enabled: true
    table_url: "https://li.feishu.cn/wiki/TZDSwvuKKi4lTIkEhN8cpklwn0c?table=tblfIzGfkyMABlZ5&view=vew225em4x"
    app_id: "${FEISHU_APP_ID}"           # 飞书应用 App ID
    app_secret: "${FEISHU_APP_SECRET}"   # 飞书应用 App Secret
    app_token: "${FEISHU_APP_TOKEN}"     # 多维表格 App Token（见下方说明）
    table_id: "${FEISHU_TABLE_ID}"       # 数据表 Table ID（见下方说明）
    # 可选：覆盖默认列名映射（Python key -> 飞书列名）
    # field_map:
    #   title: "标题"
    #   url: "链接"
    #   summary: "摘要"
    #   feed_name: "来源"
    #   published: "发布时间"

  # Telegram
  telegram:
    enabled: false
    bot_token: "${TELEGRAM_BOT_TOKEN}"
    chat_id: "${TELEGRAM_CHAT_ID}"

  # Email
  email:
    enabled: false
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    username: "${EMAIL_USER}"
    password: "${EMAIL_PASS}"
    to: "you@example.com"

# 运行配置
schedule:
  interval_minutes: 5  # 每15分钟检查一次
  max_articles_per_run: 10  # 每次最多处理10篇（全局总上限）
  # max_articles_per_feed: 3  # 每个 feed 默认上限；可被 feed 级 max_articles 覆盖
  max_age_hours: 48  # 只处理最近24小时内的文章
