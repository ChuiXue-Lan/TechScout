# RSS 订阅 - HN Popular Blogs 2025
feeds:
  - name: "Arxiv CS.AI"
    url: "https://rss.arxiv.org/rss/cs.AI"
    max_articles: 2
    keywords:  # 只处理包含这些词的文章（OR 逻辑，不区分大小写）
      - "agent"
      - "RAG"
      - "SFT"
      - "reinforcement learning"
      - "retrieval-augmented"
    exclude_keywords:  # 命中任意一个即丢弃（OR 逻辑，不区分大小写）
      # 医疗与生物医学 AI
      - "clinical"
      - "radiology"
      - "biomedical"
      - "healthcare"
      - "psychiatric"
      - "brain image"
      - "fMRI"
      - "CT report"
      - "medical image"
      - "drug discovery"
      # 教育与人机交互
      - "tutoring"
      - "autism"
      - "academic writing"
      - "mixed reality"
      - "anthropomorphism"
      - "campus"
      # 科学 AI（物理、化学、材料）
      - "atomistic"
      - "XANES"
      - "molecular generation"
      - "physics research"
      - "materials discovery"
      - "first-principles"
      - "quantum circuit"
      # 联邦学习
      - "federated learning"
      # 推理与定理证明
      - "theorem proving"
      - "formal proof"
      - "Lean 4"
      - "Isabelle"
      # AI 安全与对齐（P2 特定，避免误伤 agent safety）
      - "jailbreak"
      - "subliminal"
      - "belief revision"
      - "propaganda"
      - "epistemic sovereignty"
